# Pubblica le Edge Function su Supabase quando cambiano (niente più copia-incolla nell'editor).
# Serve un solo segreto nel repo: SUPABASE_ACCESS_TOKEN.
# I segreti delle funzioni (Twelve Data, Gemini, Telegram, VAPID...) restano su Supabase, non qui.
name: Funzioni Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wmohjmvqxbcwbmyzxffh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Pubblico tutte le funzioni
        run: |
          for dir in supabase/functions/*/; do
            nome=$(basename "$dir")
            [ "$nome" = "_shared" ] && continue
            echo "→ $nome"
            supabase functions deploy "$nome" --project-ref "$PROJECT_REF" --use-api
          done
